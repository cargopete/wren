name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

env:
  # The commands CI runs live in yatr.toml, so `yatr ci` locally is the same gate.
  YATR_VERSION: "1.2.0"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4
        env:
          RABBITMQ_DEFAULT_USER: wren
          RABBITMQ_DEFAULT_PASS: wren
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.16.0"
          rebar3-version: "3"
          # elixir-version: "1"
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - run: yatr test
      - run: yatr fmt-check
